<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0b1020">
<title>Divulgador | Site do Vendedor</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
:root{--bg:#0b1020;--card:#121a30;--card2:#17213c;--bd:#26324f;--tx:#eef2ff;--mu:#9aa6c4;--red:#ff3b4e;--grn:#2ee6a6;--blu:#5b8cff;--gold:#ffc94d}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.45}
body{min-height:100vh;background:radial-gradient(900px 420px at 85% -10%,#ff3b4e22,transparent),radial-gradient(800px 400px at -10% 10%,#5b8cff1f,transparent),var(--bg)}
.w{max-width:560px;margin:0 auto;padding:20px 16px 60px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:4px 0 18px}
header b{font-size:17px}header small{display:block;color:var(--mu);font-size:12.5px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:18px;margin:0 0 14px}
h1{font-size:25px;line-height:1.2;margin:0 0 8px}h2{font-size:17px;margin:0 0 10px}
p{margin:0 0 10px;color:var(--mu);font-size:14.5px}
label{display:block;font-size:13px;font-weight:600;margin:12px 0 5px}
input{width:100%;font-size:16px;padding:13px 12px;border-radius:12px;border:1px solid var(--bd);background:#0d1428;color:var(--tx);font-family:inherit}
input:focus{outline:2px solid var(--blu);outline-offset:1px}
.btn{display:inline-block;border:0;border-radius:12px;padding:13px 18px;font-size:15px;font-weight:700;cursor:pointer;background:linear-gradient(135deg,#ff3b4e,#d81b3a);color:#fff;font-family:inherit}
.btn.o{background:transparent;border:1px solid var(--bd);color:var(--tx);font-weight:600}
.btn.full{width:100%;margin-top:16px}
.btn:disabled{opacity:.6;cursor:wait}
.mini{border:1px solid var(--bd);background:#ffffff0a;color:var(--tx);border-radius:10px;padding:7px 12px;font-size:13px;cursor:pointer;font-family:inherit}
.tabs{display:flex;gap:6px;background:#0d1428;border:1px solid var(--bd);border-radius:14px;padding:4px;margin:0 0 14px}
.tabs button{flex:1;border:0;border-radius:10px;padding:11px;font-size:14.5px;font-weight:700;background:transparent;color:var(--mu);cursor:pointer;font-family:inherit}
.tabs button.on{background:var(--card2);color:var(--tx)}
.err{color:#ff8a96;font-size:13.5px;min-height:18px;margin:10px 0 0}
.bar{height:10px;border-radius:99px;background:#ffffff14;overflow:hidden;margin:8px 0}
.bar span{display:block;height:100%;background:linear-gradient(90deg,var(--blu),var(--grn))}
.big{font-size:44px;font-weight:800;line-height:1}
.big i{font-size:20px;font-style:normal;color:var(--mu);font-weight:600}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.lk{display:flex;gap:8px;align-items:center;background:#0d1428;border:1px solid var(--bd);border-radius:12px;padding:10px 12px;margin:8px 0;word-break:break-all;font-size:14px}
.lk code{flex:1}
.pod{display:flex;gap:12px;align-items:center;padding:12px;border-radius:14px;background:#ffffff08;border:1px solid var(--bd);margin:0 0 8px}
.pod.eu{border-color:var(--grn);background:#2ee6a612}
.pod .m{font-size:28px}.pod div{flex:1;min-width:0}.pod b{display:block;font-size:15.5px;overflow-wrap:anywhere}.pod small{color:var(--mu);font-size:12.5px}
.tag{display:inline-block;padding:4px 10px;border-radius:99px;font-size:12.5px;font-weight:700}
.tag.w2{background:#ffc94d22;color:var(--gold)}.tag.ok{background:#2ee6a622;color:var(--grn)}.tag.no{background:#ff3b4e22;color:#ff8a96}
ul.r{margin:0;padding-left:18px;color:var(--mu);font-size:14px}ul.r li{margin:0 0 5px}
.vl{margin:0;padding:0;list-style:none}.vl li{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--bd);font-size:14px}.vl li:last-child{border:0}
.vl span{color:var(--mu)}
.hp{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
.hide{display:none!important}
.ok2{color:var(--grn);font-size:14px;margin:10px 0 0}
</style>
</head>
<body>
<div class="w">
  <header>
    <div><b>Site do Vendedor</b><small>Área do divulgador</small></div>
    <button class="mini hide" id="sair" onclick="sair()">Sair</button>
  </header>
  <div id="app"><div class="card"><p>Carregando…</p></div></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const SB_URL='https://qrmwgqkiwoenlkfzjazs.supabase.co',SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFybXdncWtpd29lbmxrZnpqYXpzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA4MDc3OTIsImV4cCI6MjEwNjM4Mzc5Mn0.lhgkQS_WcB55uG0SKk0ngQgpc9oruFRt2H2D8orjNnc';
const sb=supabase.createClient(SB_URL,SB_KEY,{auth:{storageKey:'sb-divulgador-auth'}});
const $=i=>document.getElementById(i);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const R=n=>'R$ '+Number(n||0).toLocaleString('pt-BR',{minimumFractionDigits:0,maximumFractionDigits:2});
const DT=s=>{try{return new Date(s).toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit',year:'2-digit'})}catch(e){return ''}};
const BASE='https://sitevendedor.com';
let INFO=null,MODO='entrar';

function msk(e){let v=e.value.replace(/\D/g,'').slice(0,11);e.value=v.length>7?'('+v.slice(0,2)+') '+v.slice(2,7)+'-'+v.slice(7):v.length>2?'('+v.slice(0,2)+') '+v.slice(2):v}
function copia(t){try{navigator.clipboard.writeText(t).then(()=>alert('Copiado!'),()=>prompt('Copie o texto:',t))}catch(e){prompt('Copie o texto:',t)}}
function msgErro(e){const m=String((e&&e.message)||e||'');if(/invalid login|invalid_credentials/i.test(m))return 'E-mail ou senha incorretos.';if(/rate limit|too many/i.test(m))return 'Muitas tentativas. Aguarde um pouco.';return m||'Não foi possível concluir. Tente de novo.'}

function infoH(){if(!INFO)return '';const pct=Math.min(100,Math.round(INFO.total/INFO.meta*100));
  return `<div class="card"><h2>Concurso de divulgação</h2><div class="big">${INFO.total} <i>/ ${INFO.meta}</i></div><div class="bar"><span style="width:${pct}%"></span></div><p>${INFO.encerrado?'Meta atingida: o concurso foi encerrado.':'vendedores já compraram o sistema. O concurso termina quando chegar a '+INFO.meta+'.'}</p>
  <div class="pod"><span class="m">🥇</span><div><b>${R(INFO.premios[0])}</b><small>1º lugar</small></div></div>
  <div class="pod"><span class="m">🥈</span><div><b>${R(INFO.premios[1])}</b><small>2º lugar</small></div></div>
  <div class="pod"><span class="m">🥉</span><div><b>${R(INFO.premios[2])}</b><small>3º lugar</small></div></div></div>`}
function regrasH(){return `<div class="card"><h2>Como funciona</h2><ul class="r"><li>Você recebe um link seu para mandar a vendedores de moto Honda.</li><li>Conta quando o vendedor <b>compra o sistema</b> pelo seu link (pagamento aprovado).</li><li>O mesmo vendedor ou celular conta uma vez só, e compra do próprio divulgador não conta.</li><li>Ganham os 3 que mais trouxeram vendedores. Em empate, vence quem chegou primeiro.</li><li>Todas as vendas são conferidas antes do pagamento do prêmio por Pix.</li></ul></div>`}

function entrada(){
  $('sair').classList.add('hide');
  $('app').innerHTML=`<h1>Ganhe dinheiro indicando o Site do Vendedor</h1><p>Entre ou crie seu cadastro de divulgador para receber seu link e acompanhar o ranking.</p>${infoH()}
  <div class="tabs"><button id="t1" class="${MODO=='entrar'?'on':''}" onclick="MODO='entrar';entrada()">Entrar</button><button id="t2" class="${MODO=='cad'?'on':''}" onclick="MODO='cad';entrada()">Quero divulgar</button></div>
  <div class="card">${MODO=='entrar'?`<form onsubmit="return entrar(event)"><label for="le">E-mail</label><input id="le" type="email" autocomplete="email" required><label for="ls">Senha</label><input id="ls" type="password" autocomplete="current-password" required><p class="err" id="er" role="alert"></p><button class="btn full" id="bg">Entrar</button></form>`
  :`<form onsubmit="return cadastrar(event)"><label for="cn">Nome completo</label><input id="cn" autocomplete="name" required><label for="ce">E-mail</label><input id="ce" type="email" autocomplete="email" required><label for="ct">WhatsApp com DDD</label><input id="ct" inputmode="tel" autocomplete="tel-national" placeholder="(00) 00000-0000" oninput="msk(this)" required><label for="cc">Cidade</label><input id="cc" autocomplete="address-level2" required><label for="cp">Chave Pix para receber o prêmio</label><input id="cp" placeholder="CPF, e-mail, celular ou chave aleatória" required><label for="cs">Crie uma senha (mínimo 6)</label><input id="cs" type="password" autocomplete="new-password" minlength="6" required><input class="hp" id="csite" tabindex="-1" autocomplete="off" aria-hidden="true"><p style="font-size:12.5px;margin-top:12px">Seus dados são usados só para o concurso e para pagar o prêmio. Não ficam públicos.</p><p class="err" id="er" role="alert"></p><button class="btn full" id="bg">Criar meu cadastro</button></form>`}</div>${regrasH()}`}

async function entrar(ev){ev.preventDefault();const b=$('bg');b.disabled=true;$('er').textContent='';
  try{const r=await sb.auth.signInWithPassword({email:$('le').value.trim(),password:$('ls').value});if(r.error)throw r.error;await painel()}catch(e){$('er').textContent=msgErro(e);b.disabled=false}return false}

async function cadastrar(ev){ev.preventDefault();const b=$('bg');b.disabled=true;$('er').textContent='';
  const p={nome:$('cn').value,email:$('ce').value,whatsapp:$('ct').value,cidade:$('cc').value,pix:$('cp').value,senha:$('cs').value,site:$('csite').value},em=p.email.trim(),sn=p.senha;
  try{const r=await sb.rpc('divulgador_cadastrar',{p});if(r.error)throw r.error;
    const l=await sb.auth.signInWithPassword({email:em,password:sn});if(l.error)throw l.error;await painel()}catch(e){$('er').textContent=msgErro(e);b.disabled=false}return false}

async function sair(){await sb.auth.signOut();MODO='entrar';await iniciar()}

async function painel(){
  const s=await sb.auth.getSession();if(!s.data.session)return entrada();
  const r=await sb.rpc('divulgador_painel');
  if(r.error){$('app').innerHTML=`<div class="card"><p class="err">${esc(msgErro(r.error))}</p><button class="btn o" onclick="sair()">Sair</button></div>`;return}
  const d=r.data;
  if(!d){$('app').innerHTML=`<div class="card"><h2>Esta conta não é de divulgador</h2><p>Entre com o e-mail que você usou no cadastro de divulgador, ou crie um cadastro novo.</p><button class="btn o" onclick="sair()">Sair</button></div>`;return}
  $('sair').classList.remove('hide');
  const pri=esc((d.nome||'').split(' ')[0]);
  if(d.status!='aprovado'){
    const m={pendente:['w2','Aguardando aprovação','Recebemos seu cadastro. Assim que for aprovado, seu link de divulgação aparece aqui. Fique de olho nesta página.'],recusado:['no','Cadastro não aprovado','Seu cadastro não foi aprovado para este concurso.'],suspenso:['no','Cadastro suspenso','Seu cadastro está suspenso. Fale com quem te convidou.']}[d.status]||['w2',d.status,''];
    $('app').innerHTML=`<h1>Olá, ${pri}!</h1><div class="card"><span class="tag ${m[0]}">${m[1]}</span><p style="margin-top:12px">${m[2]}</p></div>${infoH0(d)}${regrasH()}`;return}
  const link=BASE+'/ind/'+d.slug,txt='Vendedor de moto Honda: tenha seu site de vendas com vitrine, ficha de financiamento e consórcio, tudo no seu nome. Conheça: '+link;
  const pct=Math.min(100,Math.round(d.total/d.meta*100)),medal=['🥇','🥈','🥉'];
  const top=(d.top&&d.top.length)?d.top.map(x=>`<div class="pod ${x.eu?'eu':''}"><span class="m">${medal[x.pos-1]}</span><div><b>${esc(x.nome)}${x.eu?' (você)':''}</b><small>${x.pos}º lugar · ${x.vendas} vendedor(es) · prêmio ${R(d.premios[x.pos-1])}</small></div></div>`).join(''):'<p>Ninguém pontuou ainda. Seja o primeiro!</p>';
  const vendas=(d.vendas&&d.vendas.length)?`<ul class="vl">${d.vendas.map(v=>`<li><b>${esc(v.nome)}</b><span>${DT(v.em)}</span></li>`).join('')}</ul>`:'<p>Nenhum vendedor comprou pelo seu link ainda.</p>';
  $('app').innerHTML=`<h1>Olá, ${pri}!</h1>
  <div class="card"><h2>Seu link de divulgação</h2><div class="lk"><code>${esc(link)}</code></div><div class="row"><button class="btn" onclick="copia('${esc(link)}')">Copiar link</button><button class="btn o" onclick="copia(${esc(JSON.stringify(txt))})">Copiar mensagem pronta</button></div></div>
  <div class="card"><h2>Seus resultados</h2><div class="big">${d.minhas} <i>vendedor(es) compraram</i></div><p style="margin-top:8px">${d.posicao?'Você está em '+d.posicao+'º lugar no ranking.':'Você entra no ranking com a primeira venda.'}</p></div>
  <div class="card"><h2>Ranking</h2>${top}<p style="margin-top:8px">${d.encerrado?'Concurso encerrado: meta de '+d.meta+' vendedores atingida.':'Total de todos os divulgadores: '+d.total+' de '+d.meta+'.'}</p><div class="bar"><span style="width:${pct}%"></span></div></div>
  <div class="card"><h2>Vendedores que compraram pelo seu link</h2>${vendas}</div>${regrasH()}`}
function infoH0(d){return infoH()}

async function iniciar(){
  try{const i=await sb.rpc('divulgador_info');if(!i.error)INFO=i.data}catch(e){}
  const s=await sb.auth.getSession();if(s.data.session)return painel();entrada()}
iniciar();
</script>
</body>
</html>
